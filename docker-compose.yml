services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: farmmatch
      POSTGRES_USER: farmmatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
    volumes:
      - farmmatch_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farmmatch -d farmmatch"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://farmmatch:${POSTGRES_PASSWORD:-change-me-in-production}@db:5432/farmmatch
      FARMMATCH_MODE: ${FARMMATCH_MODE:-demo}
      FARMMATCH_SEED_DEMO: ${FARMMATCH_SEED_DEMO:-true}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_SESSION_HOURS: ${AUTH_SESSION_HOURS:-8}
      AUTH_BOOTSTRAP_USERNAME: ${AUTH_BOOTSTRAP_USERNAME:-admin}
      AUTH_BOOTSTRAP_PASSWORD: ${AUTH_BOOTSTRAP_PASSWORD:-}
      AUTH_MAX_LOGIN_ATTEMPTS: ${AUTH_MAX_LOGIN_ATTEMPTS:-5}
      AUTH_LOGIN_WINDOW_MINUTES: ${AUTH_LOGIN_WINDOW_MINUTES:-15}
      AUTH_LOCKOUT_MINUTES: ${AUTH_LOCKOUT_MINUTES:-15}
      INTEGRATION_API_KEY: ${INTEGRATION_API_KEY:-}
      AGENT_RUNTIME: ${AGENT_RUNTIME:-agentarts}
      AGENTARTS_ENABLED: ${AGENTARTS_ENABLED:-false}
      AGENTARTS_BASE_URL: ${AGENTARTS_BASE_URL:-}
      AGENTARTS_API_KEY: ${AGENTARTS_API_KEY:-}
      AGENTARTS_INVOKE_PATH: ${AGENTARTS_INVOKE_PATH:-/invocations}
      AGENTARTS_AGENT_ENDPOINTS_JSON: ${AGENTARTS_AGENT_ENDPOINTS_JSON:-{}}
      AGENTARTS_AGENT_KEYS_JSON: ${AGENTARTS_AGENT_KEYS_JSON:-{}}
      AGENTARTS_AUTH_HEADER: ${AGENTARTS_AUTH_HEADER:-Authorization}
      AGENTARTS_AUTH_PREFIX: ${AGENTARTS_AUTH_PREFIX:-Bearer }
      AGENTARTS_SESSION_HEADER: ${AGENTARTS_SESSION_HEADER:-x-hw-agentarts-session-id}
      AGENTARTS_TIMEOUT: ${AGENTARTS_TIMEOUT:-60}
      AMAP_WEB_SERVICE_KEY: ${AMAP_WEB_SERVICE_KEY:-}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
      OSRM_TIMEOUT: ${OSRM_TIMEOUT:-20}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    ports:
      - "${APP_PORT:-8010}:8000"

volumes:
  farmmatch_pgdata:
